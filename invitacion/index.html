<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BORJITA DELUXE PRODUCCIONES · Confirma tu asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Oswald', system-ui, sans-serif;
    color: #14210f;
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
    background:
      radial-gradient(60% 55% at 12% 12%, #bcd93b 0%, rgba(188,217,59,0) 60%),
      radial-gradient(55% 50% at 90% 22%, #52d6da 0%, rgba(82,214,218,0) 60%),
      radial-gradient(60% 55% at 88% 78%, #38ccae 0%, rgba(56,204,174,0) 60%),
      radial-gradient(60% 55% at 10% 88%, #d8e34a 0%, rgba(216,227,74,0) 60%),
      radial-gradient(45% 40% at 48% 50%, #f2f5e4 0%, rgba(242,245,228,0) 60%),
      linear-gradient(135deg, #d3e24a, #58d5cf);
  }
  .wrap {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .preview {
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(20,40,20,.35);
  }
  .preview canvas { display: block; width: 100%; height: auto; }
  .card {
    width: 100%;
    background: rgba(255,255,255,.82);
    border: 1px solid rgba(20,40,20,.12);
    border-radius: 18px;
    padding: 22px 20px 24px;
    backdrop-filter: blur(6px);
    box-shadow: 0 14px 34px rgba(20,40,20,.18);
  }
  label {
    display: block;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-size: 13px;
    color: #1c2b14;
    margin-bottom: 10px;
  }
  input[type="text"] {
    width: 100%;
    background: #fff;
    border: 1.5px solid rgba(20,40,20,.25);
    border-radius: 12px;
    padding: 15px 16px;
    color: #14210f;
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="text"]::placeholder { color: rgba(20,40,20,.4); }
  input[type="text"]:focus {
    border-color: #16a58f;
    box-shadow: 0 0 0 3px rgba(22,165,143,.18);
  }
  .err { color: #b21f2d; font-size: 13px; min-height: 18px; margin-top: 8px; }
  button {
    width: 100%;
    margin-top: 14px;
    border: none;
    border-radius: 14px;
    padding: 17px 18px;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #08130a;
    background: linear-gradient(180deg, #7ee0b0 0%, #35c9c2 55%, #17a89e 100%);
    box-shadow: 0 12px 24px rgba(23,168,158,.4), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .08s ease, filter .2s;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: translateY(1px); }
  .hint { margin-top: 14px; text-align: center; font-size: 13px; color: #33482a; line-height: 1.5; }
  .ok { margin-top: 14px; text-align: center; font-size: 14px; color: #0d7a2e; font-weight: 600; display: none; }
  .ok.show { display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="preview"><canvas id="poster"></canvas></div>
    <form class="card" id="form" autocomplete="off">
      <label for="name">Nombre y apellidos</label>
      <input type="text" id="name" name="name" placeholder="Escribe tu nombre completo" maxlength="42" />
      <div class="err" id="err"></div>
      <button type="submit" id="btn">Confirmar asistencia y descargar</button>
      <div class="ok" id="ok">✓ ¡Entrada descargada! Nos vemos el sábado.</div>
      <p class="hint">Escribe tu nombre y pulsa el botón.<br/>Se descargará tu entrada personalizada en PNG.</p>
    </form>
  </div>

<script>

/* =====================================================================
   CONFIGURACIÓN DE LA ENTRADA
   Cambia aquí los textos, la fecha, el sitio, etc.
   El QR codifica el mensaje de qrData (se lee al escanearlo).
   ===================================================================== */
const CONFIG = {
  brandLine1: "BORJITA DELUXE",
  brandLine2: "PRODUCCIONES",
  dayName:    "SÁBADO",
  dayNum:     "8",
  monthPre:   "de",
  monthName:  "Agosto",
  timeLine:   "A partir de las 15:00h",
  place:      "BorjitiHouse",
  accessLimit:"Hora límite de acceso: 15:40",
  promo:      ["PROMO", "ANTICIPADA·1", "CONSUMICIÓN"],
  units:      "x1 unidades",
  email:      "riiichiperezz@gmail.com",
  productTitle: "Producto",
  product:    "PromoAnticipada• 1 consumición",
  ageLabel:   "Edad",       age:   "+20",
  dressLabel: "Dress code",  dress: "Arreglado",
  descTitle:  "Descripción",
  desc:       "*Marcas concertadas *Prohibido acceder con: riñoneras, bandoleras, gorras, boinas, ropa deportiva o de trabajo. La organización se reserva el derecho de admisión.",
  footer1:    "La compra de esta entrada implica la aceptación de los términos de Borjita Deluxe Producciones.",
  footer2:    "Borjita Deluxe Producciones no se responsabiliza de ningún acontecimiento relativo al evento.",
  // Contenido que se lee al escanear el QR:
  qrData:     "¡TOCA Y VETE CACAHUETE EN LA FIESTA DE CAÑETE!",
  placeholderName: "Invitado Especial"
};

const W = 1000, H = 1414, SCALE = 2, CX = W / 2;
const INK = '#141414', INK2 = '#3a3a3a', INK3 = '#5a5a5a';

/* ---------- helpers ---------- */
// QR pre-generado (matriz 33x33) del mensaje de CONFIG.qrData — verificado al escanear
const QR_N = 33;
const QR_BITS = "/utRv8EQaRBum2Nrt19tpduo46LsFbSBB/qqqv4Bo44Ai4wa/PBnWBl1mnNWRKNt+yn5c6ZowcSGmKwbyupSNPiRfgVib/p4eCP3i+ljXjQwsytySEo1JYHDvDlVOnYZX4ow7hAa+4BGmEb/uHPq0EMMkRusU4+t0USBEumDySEEhPoI/vULgIA=";
const QR_BYTES = (function(){var b=atob(QR_BITS),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;})();
function qrDark(r,c){var i=r*QR_N+c;return (QR_BYTES[i>>3]>>(7-(i&7)))&1;}
function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function fitFontSize(ctx, text, weight, family, startSize, minSize, maxWidth, spacing) {
  let size = startSize;
  ctx.letterSpacing = (spacing || 0) + 'px';
  while (size > minSize) {
    ctx.font = `${weight} ${size}px ${family}`;
    if (ctx.measureText(text).width <= maxWidth) break;
    size -= 1;
  }
  return size;
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, y);
      line = words[i];
      y += lineHeight;
    } else { line = test; }
  }
  if (line) { ctx.fillText(line, x, y); y += lineHeight; }
  return y;
}
// Código de entrada determinista a partir del nombre
function ticketCode(name) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let h = 2166136261 >>> 0;
  const s = 'PNYX' + name.toUpperCase();
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  let out = 'PNYXZ';
  for (let i = 0; i < 9; i++) { out += chars[h % 36]; h = (Math.imul(h, 48271) + 11) >>> 0; }
  return out;
}

/* ---------- iconos vectoriales monocromos ---------- */
function drawPin(ctx, x, y, s, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, s * 0.5, Math.PI, 0, false);
  ctx.bezierCurveTo(x + s * 0.5, y + s * 0.55, x + s * 0.16, y + s * 0.75, x, y + s * 1.15);
  ctx.bezierCurveTo(x - s * 0.16, y + s * 0.75, x - s * 0.5, y + s * 0.55, x - s * 0.5, y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#f4f6e6';
  ctx.beginPath();
  ctx.arc(x, y, s * 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function drawCake(ctx, x, y, s, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = s * 0.09; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // base
  ctx.strokeRect(x, y, s, s * 0.6);
  // línea de decoración
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.25); ctx.lineTo(x + s, y + s * 0.25); ctx.stroke();
  // vela
  ctx.beginPath(); ctx.moveTo(x + s * 0.5, y); ctx.lineTo(x + s * 0.5, y - s * 0.28); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + s * 0.5, y - s * 0.36, s * 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawHanger(ctx, x, y, s, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = s * 0.08; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x + s * 0.5, y + s * 0.12, s * 0.12, Math.PI * 0.15, Math.PI * 1.1); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + s * 0.5, y + s * 0.24);
  ctx.lineTo(x, y + s * 0.62);
  ctx.lineTo(x + s, y + s * 0.62);
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}

/* ---------- fondo holográfico ---------- */
function drawBackground(ctx) {
  const base = ctx.createLinearGradient(0, 0, W, H);
  base.addColorStop(0, '#d5e24a');
  base.addColorStop(1, '#57d4cf');
  ctx.fillStyle = base; ctx.fillRect(0, 0, W, H);
  const blobs = [
    { x: 0.12, y: 0.12, r: 0.70, c: '#b8d63a' },
    { x: 0.90, y: 0.20, r: 0.62, c: '#4fd3da' },
    { x: 0.88, y: 0.74, r: 0.66, c: '#37ccad' },
    { x: 0.10, y: 0.86, r: 0.66, c: '#d9e34a' },
    { x: 0.52, y: 0.08, r: 0.42, c: '#e8ea55' },
    { x: 0.06, y: 0.48, r: 0.40, c: '#edf1cf' },
    { x: 0.46, y: 0.50, r: 0.40, c: '#f3f6e6' }
  ];
  for (const b of blobs) {
    const R = b.r * Math.max(W, H);
    const g = ctx.createRadialGradient(b.x * W, b.y * H, 0, b.x * W, b.y * H, R);
    g.addColorStop(0, b.c + 'ee');
    g.addColorStop(1, b.c + '00');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- título con italica + aberración cromática ---------- */
function drawTitleLine(ctx, text, y, size) {
  ctx.save();
  ctx.translate(CX, y);
  ctx.transform(1, 0, -0.20, 1, 0, 0); // shear -> italica
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = `400 ${size}px Anton`;
  ctx.letterSpacing = '0px';
  ctx.fillStyle = 'rgba(0,190,210,0.80)'; ctx.fillText(text, 5, 3);   // cyan
  ctx.fillStyle = 'rgba(230,20,140,0.80)'; ctx.fillText(text, -5, -3); // magenta
  ctx.fillStyle = '#111111'; ctx.fillText(text, 0, 0);                 // negro
  ctx.restore();
}

/* ---------- segmentos de fecha (pesos mezclados) ---------- */
function drawSegments(ctx, segs, cx, y) {
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let total = 0;
  for (const s of segs) { ctx.font = `${s.w} ${s.s}px Oswald`; total += ctx.measureText(s.t).width; }
  let x = cx - total / 2;
  for (const s of segs) {
    ctx.font = `${s.w} ${s.s}px Oswald`;
    ctx.fillStyle = s.c || INK;
    ctx.fillText(s.t, x, y);
    x += ctx.measureText(s.t).width;
  }
}

/* ---------- póster ---------- */
function drawPoster(ctx, rawName) {
  const name = (rawName && rawName.trim()) ? rawName.trim() : CONFIG.placeholderName;
  ctx.clearRect(0, 0, W, H);
  drawBackground(ctx);
  ctx.lineWidth = 1;

  /* TÍTULO */
  const s1 = fitFontSize(ctx, CONFIG.brandLine1, 400, 'Anton', 118, 60, 800, 0);
  drawTitleLine(ctx, CONFIG.brandLine1, 118, s1);
  const s2 = fitFontSize(ctx, CONFIG.brandLine2, 400, 'Anton', 118, 60, 860, 0);
  drawTitleLine(ctx, CONFIG.brandLine2, 214, s2);

  /* FECHA */
  drawSegments(ctx, [
    { t: CONFIG.dayName, w: 700, s: 70 },
    { t: ' ' + CONFIG.dayNum + ' ', w: 700, s: 70 },
    { t: CONFIG.monthPre + ' ', w: 400, s: 52 },
    { t: CONFIG.monthName, w: 600, s: 64 }
  ], CX, 360);

  /* HORA */
  ctx.textAlign = 'center'; ctx.fillStyle = INK2;
  ctx.font = '400 42px Oswald'; ctx.letterSpacing = '0px';
  ctx.fillText(CONFIG.timeLine, CX, 425);

  /* LUGAR (pin + texto) */
  ctx.font = '500 46px Oswald';
  const placeW = ctx.measureText(CONFIG.place).width;
  const pinX = CX - placeW / 2 - 34;
  drawPin(ctx, pinX, 470, 34, INK);
  ctx.textAlign = 'left'; ctx.fillStyle = INK;
  ctx.fillText(CONFIG.place, CX - placeW / 2 + 8, 496);

  /* QR (izquierda) */
  const qrSize = 300, qrX = 96, qrY = 640;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(qrX - 4, qrY - 4, qrSize + 8, qrSize + 8);
  {
    const n = QR_N, cell = qrSize / n;
    ctx.fillStyle = "#111111";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (qrDark(r, c)) ctx.fillRect(
        Math.floor(qrX + c * cell), Math.floor(qrY + r * cell),
        Math.ceil(cell), Math.ceil(cell));
    }
  }
  /* código bajo el QR */
  ctx.textAlign = 'center'; ctx.fillStyle = INK2;
  ctx.font = '400 34px "Courier New", monospace'; ctx.letterSpacing = '2px';
  ctx.fillText(ticketCode(name), qrX + qrSize / 2, qrY + qrSize + 56);
  ctx.letterSpacing = '0px';

  /* COLUMNA DERECHA (junto al QR) */
  const rx = 520;
  ctx.textAlign = 'left';
  ctx.fillStyle = INK3; ctx.font = '400 30px Oswald';
  ctx.fillText(CONFIG.accessLimit, rx, 672);

  ctx.fillStyle = INK; ctx.font = '300 54px Oswald';
  let py = 740;
  for (const line of CONFIG.promo) { ctx.fillText(line, rx, py); py += 60; }

  ctx.fillStyle = INK; ctx.font = '400 42px Oswald';
  ctx.fillText(CONFIG.units, rx, 918);

  /* separador tenue */
  ctx.strokeStyle = 'rgba(20,20,20,0.18)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(96, 1010); ctx.lineTo(W - 96, 1010); ctx.stroke();

  /* BLOQUE INFERIOR — IZQUIERDA */
  const lx = 96;
  ctx.fillStyle = INK; ctx.font = '700 36px Oswald';
  ctx.fillText(name, lx, 1075);
  ctx.fillStyle = INK3; ctx.font = '400 27px Oswald';
  ctx.fillText(CONFIG.email, lx, 1112);

  ctx.fillStyle = INK; ctx.font = '700 32px Oswald';
  ctx.fillText(CONFIG.productTitle, lx, 1178);
  ctx.fillStyle = INK2; ctx.font = '400 29px Oswald';
  ctx.fillText(CONFIG.product, lx, 1214);

  drawCake(ctx, lx + 2, 1252, 30, INK);
  ctx.fillStyle = INK2; ctx.font = '400 28px Oswald';
  ctx.fillText(CONFIG.ageLabel, lx + 52, 1272);
  ctx.fillText(CONFIG.age, lx + 220, 1272);

  drawHanger(ctx, lx, 1296, 34, INK);
  ctx.fillText(CONFIG.dressLabel, lx + 52, 1320);
  ctx.fillText(CONFIG.dress, lx + 220, 1320);

  /* BLOQUE INFERIOR — DERECHA (descripción) */
  ctx.fillStyle = INK; ctx.font = '700 32px Oswald';
  ctx.fillText(CONFIG.descTitle, rx, 1075);
  ctx.fillStyle = INK2; ctx.font = '400 25px Oswald';
  wrapText(ctx, CONFIG.desc, rx, 1112, W - 96 - rx, 33);

  /* MARCA + FOOTER */
  // emblema de la marca (círculo con monograma)
  ctx.save();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(CX, 1338, 25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f4f6e6';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 28px Anton';
  ctx.fillText('B', CX, 1341);
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(20,20,20,0.6)'; ctx.font = '400 19px Oswald';
  ctx.fillText(CONFIG.footer1, CX, 1382);
  ctx.fillText(CONFIG.footer2, CX, 1406);
}

/* ---------- lienzo ---------- */
const canvas = document.getElementById('poster');
canvas.width = W * SCALE; canvas.height = H * SCALE;
const ctx = canvas.getContext('2d');
ctx.scale(SCALE, SCALE);

let fontsReady = false;
async function ensureFonts() {
  if (fontsReady) return;
  try {
    await Promise.all([
      document.fonts.load('400 118px Anton'),
      document.fonts.load('700 70px Oswald'),
      document.fonts.load('600 64px Oswald'),
      document.fonts.load('500 46px Oswald'),
      document.fonts.load('400 42px Oswald'),
      document.fonts.load('300 54px Oswald')
    ]);
    await document.fonts.ready;
  } catch (e) {}
  fontsReady = true;
}
function render(name) { drawPoster(ctx, name); }

/* ---------- interacción ---------- */
const input = document.getElementById('name');
const form  = document.getElementById('form');
const errEl = document.getElementById('err');
const okEl  = document.getElementById('ok');

function slug(s) {
  return s.trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'invitado';
}

let t;
input.addEventListener('input', () => {
  okEl.classList.remove('show'); errEl.textContent = '';
  clearTimeout(t); t = setTimeout(() => render(input.value), 120);
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = input.value.trim();
  if (!name) { errEl.textContent = 'Escribe tu nombre para generar la entrada.'; input.focus(); return; }
  errEl.textContent = '';
  await ensureFonts();
  render(name);
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `Entrada-BorjitaDeluxe-${slug(name)}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    okEl.classList.add('show');
  }, 'image/png');
});

(async () => { render(''); await ensureFonts(); render(input.value); })();
</script>
</body>
</html>
