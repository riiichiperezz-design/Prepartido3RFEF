<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso · Borjita Deluxe Producciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Oswald', system-ui, sans-serif;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 22px;
    overflow: hidden;
  }
  .msg {
    max-width: 820px;
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    line-height: 1.05;
    letter-spacing: 0.5px;
    font-size: clamp(38px, 11vw, 96px);
    transform: skewX(-6deg);
    animation: pop .5s ease-out both;
  }
  .msg .em { color: #ffd21e; }
  @keyframes pop {
    0%   { opacity: 0; transform: skewX(-6deg) scale(.9); }
    100% { opacity: 1; transform: skewX(-6deg) scale(1); }
  }
</style>
</head>
<body>
  <h1 class="msg">¡TOCA Y VETE <span class="em">CACAHUETE</span> EN LA FIESTA DE CAÑETE!</h1>
</body>
</html>
